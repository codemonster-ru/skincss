name: Verify Changesets after key cleanup
on:
  push:
    branches:
      - codex/verify-skincss-after-key-cleanup
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: changesets-app
        with:
          client-id: ${{ vars.CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.changesets-app.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: changesets/action@v1
        with:
          title: Verify SkinCSS release PR after key cleanup
          commit: Prepare the SkinCSS release probe
          prDraft: create
        env:
          GITHUB_TOKEN: ${{ steps.changesets-app.outputs.token }}
