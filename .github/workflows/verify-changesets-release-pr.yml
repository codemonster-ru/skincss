name: Verify Changesets release PR
on:
  push:
    branches:
      - codex/verify-skincss-changesets-app
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: changesets-app
        with:
          client-id: ${{ vars.CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.changesets-app.outputs.token }}
      - name: Verify main rejects direct push using the app token
        shell: bash
        run: |
          main=$(git rev-parse refs/remotes/origin/main)
          test "$main" = a0b33567ba4c26cb7016adfb4ecedf73018c6b3a
          tree=$(git rev-parse "$main^{tree}")
          candidate=$(git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c commit.gpgsign=false commit-tree "$tree" -p "$main" -m 'Verify SkinCSS main protection')
          if output=$(git push --porcelain --no-follow-tags origin "$candidate:refs/heads/main" 2>&1); then
            echo "::error::GitHub accepted a direct push to main."
            exit 1
          fi
          echo "$output"
          grep -Fq 'GH013' <<< "$output"
          grep -Fq 'Changes must be made through a pull request' <<< "$output"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: changesets/action@v1
        with:
          title: Verify SkinCSS Changesets app
          commit: Prepare the SkinCSS release probe
          prDraft: create
        env:
          GITHUB_TOKEN: ${{ steps.changesets-app.outputs.token }}
