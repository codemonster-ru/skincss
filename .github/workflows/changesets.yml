name: Changesets

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/create-github-app-token@v3
        id: changesets-app
        with:
          client-id: ${{ vars.CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.changesets-app.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - run: npm i -g npm@11.17.0
      - run: npm -v
      - run: npm ci

      - uses: changesets/action@v1
        with:
          publish: npm run release
          commit: Prepare SkinCSS package releases
          title: Prepare SkinCSS package releases
        env:
          GITHUB_TOKEN: ${{ steps.changesets-app.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
