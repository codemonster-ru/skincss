name: Changesets

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - run: npm i -g npm@11.17.0
      - run: npm -v
      - run: npm ci

      - uses: changesets/action@v1
        with:
          publish: npm run release
          commit: Prepare SkinCSS package releases
          title: Prepare SkinCSS package releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
