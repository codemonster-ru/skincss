name: Changesets

on:
  push:
    branches:
      - main
    tags:
      - '@codemonster-ru/skincss@1.0.1'
      - '@codemonster-ru/vite-plugin-skincss@1.0.1'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - run: npm i -g npm@11.17.0
      - run: npm -v
      - run: npm ci

      - uses: changesets/action@v1
        with:
          publish: npm run release
          commit: Prepare SkinCSS package releases
          title: Prepare SkinCSS package releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  release-corrected-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"

      - run: npm i -g npm@11.17.0
      - run: npm ci
      - run: npm run build-all

      - name: Publish the tagged package
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            '@codemonster-ru/skincss@1.0.1'|'@codemonster-ru/vite-plugin-skincss@1.0.1') ;;
            *) exit 1 ;;
          esac
          package="${GITHUB_REF_NAME%@*}"
          version="${GITHUB_REF_NAME##*@}"
          actual="$(npm pkg get version --workspace "$package" | node -e 'const v = JSON.parse(require("node:fs").readFileSync(0, "utf8")); console.log(v[process.argv[1]])' "$package")"
          test "$version" = "$actual"

          output="$(mktemp -d)"
          filename="$(npm pack --json --ignore-scripts --workspace "$package" --pack-destination "$output" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0].filename')"
          tarball="$output/$filename"
          if integrity="$(npm view "$GITHUB_REF_NAME" dist.integrity --json 2>/dev/null)" && test -n "$integrity"
          then
            expected="$(node -e 'const hash = require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(process.argv[1])).digest("base64"); console.log(JSON.stringify("sha512-" + hash))' "$tarball")"
            test "$integrity" = "$expected"
          else
            npm publish "$tarball" --access public --provenance --tag latest
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes "Publish this package from the corrected commit history with fresh npm provenance."
          fi
